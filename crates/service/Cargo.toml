[package]
name = "tunelock-service"
description = "Background service that owns Tunelock sessions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
interprocess.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tunelock-core.workspace = true
tunelock-protocol.workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Environment",
] }

[dev-dependencies]
tempfile.workspace = true

# Same as the workspace lints, except that `unsafe` is denied instead of
# forbidden so the Windows FFI module can opt in (`src/windows/acl.rs`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
