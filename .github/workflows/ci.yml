name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Extension and desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            extension/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml
      - name: Extension
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Desktop frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  rust-linux:
    name: Rust (Linux, without the desktop app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude tunelock-desktop --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude tunelock-desktop --locked

  rust-windows:
    name: Rust (Windows, whole workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            extension/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml
      # The desktop app embeds the extension and the frontend at build time.
      - name: Build the extension and the frontend
        shell: bash
        run: |
          (cd extension && pnpm install --frozen-lockfile && pnpm build)
          (cd apps/desktop && pnpm install --frozen-lockfile && pnpm build)
      # The desktop build script checks that the files the installer bundles
      # exist. Empty placeholders are enough for clippy and the tests.
      - name: Create placeholders for the bundled executables
        shell: bash
        run: |
          mkdir -p target/x86_64-pc-windows-msvc/release
          touch target/x86_64-pc-windows-msvc/release/tunelock-service.exe target/x86_64-pc-windows-msvc/release/tunelock.exe
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
